<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Session - Laura's Wellness</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0033, #4b0082);
            color: white;
            text-align: center;
        }

        /* Very Small Currency Switcher */
        #currency {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 100;
    width: 42px;
    height: 24px;
    padding: 0;
    font-size: 10px;
    background: #ffd700;
    color: #1a0033;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}
        }
        #currency:hover {
            background: #ffed4e;
        }

        form {
            max-width: 700px;
            margin: 70px auto 40px;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        button[type="submit"] {
            background: #ffd700;
            color: #1a0033;
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Very Small Currency Switcher -->
    <select id="currency" onchange="changeCurrency()">
        <option value="USD">$</option>
        <option value="EUR">€</option>
        <option value="GBP">£</option>
        <option value="CAD">C$</option>
        <option value="AUD">A$</option>
        <option value="NGN">₦</option>
    </select>

    <header>
        <h1>LAURA'S WELLNESS</h1>
        <p style="color: #bb86fc; font-size: 1.3em;">LICENSED MASSAGE THERAPIST</p>
    </header>

    <section>
        <h2>📅 Book Your Healing Session</h2>
        <p>Virtual Consultations & In-Person Appointments Available</p>

        <form id="bookingForm" onsubmit="handleSubmit(event)">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="tel" placeholder="Phone Number" required>
            
            <select id="packageSelect" required>
                <option value="">Select Package</option>
                <option value="60" data-usd="100">60 Minutes — $100</option>
                <option value="90" data-usd="150">90 Minutes — $150</option>
                <option value="120" data-usd="120">120 Minutes — $120</option>
            </select>
            
            <input type="date" required>
            <input type="time" required>
            <textarea rows="4" placeholder="Any specific concerns or preferences?"></textarea>
            
            <button type="submit">SUBMIT BOOKING REQUEST</button>
        </form>

        <p><strong>Payment Methods:</strong> PayPal, Cash App, Chime, Bank Transfer, Cards</p>
    </section>

    <footer style="background: rgba(0,0,0,0.8); padding: 25px; margin-top: 40px; color: white;">
        <p>© 2026 Laura's Wellness • Licensed Massage Therapist</p>
    </footer>

    <script>
        const rates = {
            USD: { rate: 1, symbol: '$' },
            EUR: { rate: 0.86, symbol: '€' },
            GBP: { rate: 0.74, symbol: '£' },
            CAD: { rate: 1.35, symbol: 'C$' },
            AUD: { rate: 1.48, symbol: 'A$' },
            NGN: { rate: 1650, symbol: '₦' }
        };

        function changeCurrency() {
            const curr = document.getElementById('currency').value;
            const { rate, symbol } = rates[curr];

            document.querySelectorAll('#packageSelect option').forEach(option => {
                if (option.value) {
                    const usd = parseFloat(option.getAttribute('data-usd'));
                    const newPrice = Math.round(usd * rate);
                    const base = option.textContent.split(' — ')[0];
                    option.textContent = `${base} — ${symbol}${newPrice}`;
                }
            });
        }

        function handleSubmit(e) {
            e.preventDefault();
            const name = document.querySelector('input[placeholder="Full Name"]').value;
            const email = document.querySelector('input[placeholder="Email Address"]').value;
            const phone = document.querySelector('input[placeholder="Phone Number"]').value;
            
            const packageSelect = document.getElementById('packageSelect');
            const selected = packageSelect.options[packageSelect.selectedIndex];
            const serviceText = selected.textContent;

            localStorage.setItem("customerName", name);
            localStorage.setItem("customerEmail", email);
            localStorage.setItem("customerPhone", phone);
            localStorage.setItem("service", serviceText);
            localStorage.setItem("amount", serviceText.split('—')[1] || "$0");
            localStorage.setItem("payment", "PayPal / Bank Transfer");

            window.location.href = "receipt.html";
        }

        window.onload = () => changeCurrency();
    </script>
</body>
</html>
