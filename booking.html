<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Session - Laura's Wellness</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0033, #4b0082);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        #currency {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 60px;
            height: 30px;
            padding: 0;
            margin: 0;
            z-index: 9999;
            background: #ffd700;
            color: #1a0033;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
        }
        #currency:hover { background: #ffed4e; }

        header { padding: 30px 20px 10px; }
        header h1 { margin: 0; font-size: 2em; letter-spacing: 2px; }

        section { padding: 0 20px 40px; }

        form {
            max-width: 700px;
            margin: 30px auto 40px;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        input,
        textarea,
        #packageSelect {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1em;
        }

        input::placeholder,
        textarea::placeholder { color: rgba(255,255,255,0.7); }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        #packageSelect option { background: #2d0060; color: white; }

        button[type="submit"] {
            background: #ffd700;
            color: #1a0033;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button[type="submit"]:hover { background: #ffed4e; transform: scale(1.02); }
        button[type="submit"]:disabled {
            background: #aaa;
            color: #333;
            cursor: not-allowed;
            transform: none;
        }

        #toast {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease;
            white-space: nowrap;
        }
        #toast.success { background: #28a745; color: white; }
        #toast.error   { background: #dc3545; color: white; }

        @keyframes fadeIn {
            from { opacity: 0; bottom: 10px; }
            to   { opacity: 1; bottom: 30px; }
        }

        footer {
            background: rgba(0,0,0,0.8);
            padding: 25px;
            margin-top: 40px;
            color: white;
        }
    </style>
</head>
<body>

    <select id="currency" onchange="changeCurrency()">
        <option value="USD">$</option>
        <option value="EUR">€</option>
        <option value="GBP">£</option>
        <option value="CAD">C$</option>
        <option value="AUD">A$</option>
        <option value="NGN">₦</option>
    </select>

    <header>
        <h1>LAURA'S WELLNESS</h1>
        <p style="color: #bb86fc; font-size: 1.3em;">LICENSED MASSAGE THERAPIST</p>
    </header>

    <section>
        <h2>📅 Book Your Healing Session</h2>
        <p>Virtual Consultations & In-Person Appointments Available</p>

        <form id="bookingForm" onsubmit="handleSubmit(event)">
            <input type="text"  id="fullName"  placeholder="Full Name"     required>
            <input type="email" id="email"     placeholder="Email Address" required>
            <input type="tel"   id="phone"     placeholder="Phone Number"  required>

            <select id="packageSelect" required>
                <option value="">Select Package</option>
                <option value="60"  data-usd="100">60 Minutes — $100</option>
                <option value="90"  data-usd="150">90 Minutes — $150</option>
                <option value="120" data-usd="180">120 Minutes — $180</option>
            </select>

            <input type="date" id="apptDate" required>
            <input type="time" id="apptTime" required>
            <textarea id="message" rows="4" placeholder="Any specific concerns or preferences?"></textarea>

            <button type="submit" id="submitBtn">SUBMIT BOOKING REQUEST</button>
        </form>

        <p><strong>Payment Methods:</strong> PayPal, Cash App, Chime, Bank Transfer, Cards</p>
    </section>

    <footer>
        <p>© 2026 Laura's Wellness • Licensed Massage Therapist</p>
    </footer>

    <div id="toast"></div>

    <script>
        emailjs.init("vMNkMcyjqInTfrX52");

        const SERVICE_ID  = "service_5gszskr";
        const TEMPLATE_ID = "template_vphnp4m";

        const rates = {
            USD: { rate: 1,    symbol: '$'  },
            EUR: { rate: 0.86, symbol: '€'  },
            GBP: { rate: 0.74, symbol: '£'  },
            CAD: { rate: 1.35, symbol: 'C$' },
            AUD: { rate: 1.48, symbol: 'A$' },
            NGN: { rate: 1650, symbol: '₦'  }
        };

        function changeCurrency() {
            const curr = document.getElementById('currency').value;
            const { rate, symbol } = rates[curr];
            document.querySelectorAll('#packageSelect option').forEach(option => {
                if (option.value) {
                    const usd      = parseFloat(option.getAttribute('data-usd'));
                    const newPrice = Math.round(usd * rate);
                    const base     = option.textContent.split(' — ')[0];
                    option.textContent = `${base} — ${symbol}${newPrice}`;
                }
            });
        }

        function showToast(msg, type = 'success', duration = 5000) {
            const toast = document.getElementById('toast');
            toast.textContent   = msg;
            toast.className     = type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, duration);
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled    = true;
            btn.textContent = 'Sending…';

            const name    = document.getElementById('fullName').value.trim();
            const email   = document.getElementById('email').value.trim();
            const phone   = document.getElementById('phone').value.trim();
            const date    = document.getElementById('apptDate').value;
            const time    = document.getElementById('apptTime').value;
            const message = document.getElementById('message').value.trim();

            const packageSelect = document.getElementById('packageSelect');
            const packageText   = packageSelect.options[packageSelect.selectedIndex].textContent;

            const templateParams = {
                from_name  : name,
                from_email : email,
                phone      : phone,
                package    : packageText,
                date       : date,
                time       : time,
                message    : message || 'No additional notes.'
            };

            try {
                await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);

                localStorage.setItem("customerName",  name);
                localStorage.setItem("customerEmail", email);
                localStorage.setItem("customerPhone", phone);
                localStorage.setItem("service",       packageText);
                localStorage.setItem("amount",        packageText.split('—')[1]?.trim() || "$0");
                localStorage.setItem("payment",       "PayPal / Bank Transfer");

                showToast('✅ Booking sent! You will receive a confirmation shortly.', 'success');
                setTimeout(() => { window.location.href = "receipt.html"; }, 2000);

            } catch (error) {
                console.error("EmailJS error:", error);
                showToast('❌ Something went wrong. Please try again or contact us directly.', 'error', 7000);
                btn.disabled    = false;
                btn.textContent = 'SUBMIT BOOKING REQUEST';
            }
        }

        window.onload = () => changeCurrency();
    </script>
</body>
</html>
